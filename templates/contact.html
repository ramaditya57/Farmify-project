<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmify | Contact Us</title>
    <meta name="description" content="Get in touch with the Farmify team">
    <link rel="stylesheet" href="/static/styles/design-system.css">
    <link rel="stylesheet" href="/static/styles/contact.css">
    <link rel="stylesheet" href="/static/styles/navbar.css">
    <link rel="stylesheet" href="/static/styles/loader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="loader"></div>
    </div>

    <div class="ambient-particles"></div>

    <header class="header-bar" id="header-bar">
        <a class="farmify-logo" href="/mainsec"></a>
        <button class="farmify-menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <nav class="farmify-nav" id="farmify-nav">
            <ul>
                <li><a href="/mainsec" class="nav-link"><i class="fas fa-home"></i> HOME</a></li>
                <li><a href="/team" class="nav-link"><i class="fas fa-users"></i> OUR TEAM</a></li>
                <li><a href="/contact" class="nav-link"><i class="fas fa-envelope"></i> CONTACT</a></li>
                <li><a href="{{ chatbot_url }}/" id="chatbot-link" class="nav-link"><i class="fas fa-robot"></i> CHATBOT</a></li>
                <li class="dropdown">
                    <button class="dropbtn" id="user-email">Loading...</button>
                    <div class="dropdown-content">
                        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <div class="contact-page">
        <div class="contact-wrapper reveal">
            <div class="contact-card glass-card-strong">
                <div class="contact-header">
                    <div class="contact-icon">
                        <i class="fas fa-paper-plane"></i>
                    </div>
                    <h1>Get in Touch</h1>
                    <p>We'd love to hear from you. Drop us a message!</p>
                </div>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label class="input-label" for="name"><i class="fas fa-user"></i> Name</label>
                        <input type="text" id="name" class="input-modern" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" class="input-modern" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="input-label" for="message"><i class="fas fa-comment-dots"></i> Message</label>
                        <textarea id="message" class="input-modern" placeholder="Tell us what's on your mind..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="input-label"><i class="fas fa-star"></i> Rating</label>
                        <div class="rating-container" id="starRating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" id="rating" value="0">
                    </div>
                    <button type="submit" class="btn-primary submit-btn">
                        <span><i class="fas fa-paper-plane"></i> Send Message</span>
                    </button>
                </form>
                <p id="responseMessage" class="response-message">
                    <i class="fas fa-check-circle"></i> Thank you for your feedback!
                </p>
            </div>
        </div>
    </div>

    <footer class="footer-modern">
        &copy; Made with <i class="fas fa-heart"></i> by students of VIT Bhopal.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="/static/scripts/contact.js"></script>
    <script type="module" src="/static/scripts/signupId.js"></script>
    <script src="/static/scripts/loader.js"></script>
    <script src="/static/scripts/navbar.js"></script>
    <script src="/static/scripts/scroll-animations.js"></script>
</body>
</html>
