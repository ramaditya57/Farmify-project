<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmify | Login</title>
    <meta name="description" content="Login to Farmify — AI-powered smart agriculture platform">
    <link rel="stylesheet" href="/static/styles/design-system.css">
    <link rel="stylesheet" href="/static/styles/loader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles/login.css">
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="loader"></div>
    </div>

    <!-- Three.js particle canvas -->
    <canvas id="particle-canvas"></canvas>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="brand-icon">🌾</span>
                <h1>Farmify</h1>
                <p>Smart Agriculture, Smarter Future</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>
                <div class="form-extras">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="button" id="submit" class="login-btn">
                    <span>Sign In</span>
                </button>
            </form>

            <div class="divider"><span>or</span></div>

            <button onclick="loginWithGoogle()" class="google-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                    <path d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z" fill="#4285F4"/>
                    <path d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z" fill="#34A853"/>
                    <path d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z" fill="#FBBC05"/>
                    <path d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div class="signup-link">
                Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        // Prevent navigating back
        history.pushState(null, null, location.href);
        window.onpopstate = function () { history.go(1); };
    </script>

    <script src="/static/scripts/loader.js"></script>
    <script type="module" src="/static/scripts/login.js" defer></script>
    <script src="/static/scripts/login-particles.js"></script>
</body>
</html>
