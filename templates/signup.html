<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmify | Sign Up</title>
    <meta name="description" content="Create your Farmify account — AI-powered smart agriculture">
    <link rel="stylesheet" href="/static/styles/design-system.css">
    <link rel="stylesheet" href="/static/styles/loader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles/signup.css">
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="loader"></div>
    </div>

    <div class="bg-mesh"></div>

    <div class="signup-wrapper">
        <div class="signup-card">
            <div class="signup-logo">
                <span class="brand-icon">🌱</span>
                <h1>Join Farmify</h1>
                <p>Start your smart farming journey</p>
            </div>

            <form class="signup-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="signup-password" placeholder="Create a password" autocomplete="new-password">
                    </div>
                </div>
                <button type="button" id="signup-btn" class="signup-btn">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </div>
        </div>
    </div>

    <script type="module" src="/static/scripts/signup.js" defer></script>
    <script src="/static/scripts/loader.js"></script>
</body>
</html>
